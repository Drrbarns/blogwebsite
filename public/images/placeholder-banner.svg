<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Banner placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="55%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#fed7aa">
    <text x="80" y="320" font-size="76" font-weight="800" letter-spacing="-2">Bring your brand to life.</text>
    <text x="80" y="380" font-size="22" font-weight="500" opacity="0.7">Upload a hero image in the Site / About-Page admin.</text>
  </g>
</svg>
